<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conheça nosso produto fitness e acesse o checkout com segurança.">
  <title>Produto Fitness</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      color: #1c2922;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.09);
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e2f7e9;
      color: #176534;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 6vw, 36px); }
    p { color: #526158; line-height: 1.6; margin: 0 0 22px; }
    .buy-button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: #188647;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 17px;
    }
    .buy-button:focus-visible { outline: 3px solid #1b5e35; outline-offset: 4px; }
    .note { font-size: 12px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">PRODUTO FITNESS</span>
    <h1>10 Receitas Low Carb para o Verão 2026</h1>
    <p>Descubra receitas práticas para variar sua alimentação. Toque no botão abaixo para continuar para o checkout.</p>

    <!-- O link direto funciona sem precisar de script.js -->
    <a
      class="buy-button"
      id="buy-button"
      href="https://pay.cakto.com.br/63662xq_1237052"
    >COMPRAR AGORA</a>

    <p class="note">Você será direcionado à página de pagamento da Cakto.</p>
  </main>
</body>
</html>
